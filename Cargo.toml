[package]
name = "peerpigeon-rs"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "WebRTC-based peer-to-peer mesh networking library in Rust"

[lib]
name = "peerpigeon"
path = "src/lib.rs"

[[bin]]
name = "pp-cli"
path = "src/bin/pp-cli.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
futures = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
url = "2"
thiserror = "1"
dashmap = "5"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
tokio-tungstenite = { version = "0.21", default-features = false, features = ["rustls-tls-webpki", "url"] }
tungstenite = { version = "0.24", default-features = false, features = ["rustls-tls-webpki"] }
webrtc = "0.9"
aes-gcm = { version = "0.10", features = ["aes"] }
x25519-dalek = "2"
hkdf = "0.12"

[features]
default = ["data"]
data = []

